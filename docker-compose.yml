version: '3.8'

services:
  clamav:
    image: ajilaag/clamav-rest:latest
    container_name: clamav_service
    ports:
      - "9000:9000"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_service
    ports:
      # Expose directly to your Windows host machine
      - "5678:5678"
    restart: unless-stopped
    environment:
      # 0.0.0.0 tells n8n to accept traffic routed by Docker
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Point the webhook to standard localhost
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=n8nComplianceHubSecretKey
      # Auto-create owner account (n8n 2.17+) - no manual setup needed!
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=admin@compliance-hub.local
      - N8N_INSTANCE_OWNER_FIRST_NAME=Admin
      - N8N_INSTANCE_OWNER_LAST_NAME=User
      # bcrypt hash of "password" (generated with: php -r "echo password_hash('password', PASSWORD_BCRYPT);")
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: